<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibes Studio - Smart Video Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #050505; color: #f3f3f3; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .header { margin-top: 30px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .brand-monogram {
            font-family: 'Cinzel', serif; font-size: 3.5rem; font-weight: 900;
            background: linear-gradient(135deg, #fff 10%, #fcf6ba 40%, #bf953f 70%, #aa771c 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px;
        }
        .header h1 { font-family: 'Cinzel', serif; font-size: 2.2rem; color: #fff; margin-bottom: 6px; }
        .header p { color: #bfa15f; font-size: 0.95rem; }
        .container {
            background: #111111; padding: 25px; border-radius: 18px;
            border: 1px solid rgba(191, 149, 63, 0.4); width: 100%; max-width: 600px; margin-top: 25px;
        }
        .section-title { font-family: 'Cinzel', serif; font-size: 1.3rem; color: #bf953f; margin-bottom: 12px; text-transform: uppercase; }
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .input-group input {
            padding: 15px; border-radius: 10px; border: 1px solid rgba(191, 149, 63, 0.5);
            background: #1a1a1a; color: #fff; font-size: 1rem; outline: none; width: 100%;
        }
        .btn-download {
            background: linear-gradient(135deg, #bf953f, #aa771c); color: #050505; font-weight: 700;
            padding: 15px; border-radius: 10px; border: none; font-size: 1.1rem; cursor: pointer; text-align: center; width: 100%;
            transition: 0.3s ease;
        }
        .btn-download:hover { opacity: 0.9; }
        .note { margin-top: 15px; font-size: 0.85rem; color: #888; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-monogram">VS</div>
        <h1>Vibes Studio</h1>
        <p>The Ultimate Luxury All-in-One Media Handler</p>
    </div>

    <div class="container">
        <h2 class="section-title">Paste Video Link</h2>
        <div class="input-group">
            <input type="text" id="videoLink" placeholder="Paste Facebook, TikTok, Insta or YouTube link here...">
            <button type="button" class="btn-download" onclick="redirectToDownloader()">Process & Get Download Link</button>
        </div>
        <div class="note">
            ⚡ Instant secure redirection to high-speed processing engine. Never fails, no server errors!
        </div>
    </div>
    <<script>
    const API_URL = "https://vibes-studio-production.up.railway.app/api/download";
    let downloadUrls = {};

    function fetchVideoData() {
        const link = document.getElementById('videoLink').value.trim();
        if (!link) { alert('Please paste a video link first!'); return; }

        document.getElementById('loadingSpinner').style.display = 'block';
        document.getElementById('previewContainer').style.display = 'none';

        fetch(`${API_URL}?url=${encodeURIComponent(link)}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loadingSpinner').style.display = 'none';
                if (data.error) { alert('Error: ' + data.error); return; }

                document.getElementById('previewContainer').style.display = 'block';
                document.getElementById('downloadOptions').style.display = 'block';

                document.getElementById('videoTitleDisplay').innerText = data.title;
                document.getElementById('videoMetaDisplay').innerText = "Ready to download";

                if (data.thumbnail) {
                    document.getElementById('thumbContainer').innerHTML = `<img src="${data.thumbnail}" alt="Thumbnail">`;
                } else {
                    document.getElementById('thumbContainer').innerHTML = `<span>[ No Thumbnail ]</span>`;
                }

                downloadUrls = { sd: data.video, hd: data.video, mp3: data.audio };
            })
            .catch(err => {
                document.getElementById('loadingSpinner').style.display = 'none';
                alert('Server se connect nahi ho paya. Railway link check karein.');
            });
    }

    function downloadVideo(quality, btn) {
        const url = downloadUrls[quality.toLowerCase()];
        if (!url) { alert('Link missing. Try again.'); return; }

        let timeLeft = 3;
        const originalText = btn.innerHTML;
        btn.innerHTML = `Wait ${timeLeft}s...`;
        btn.disabled = true;

        const timer = setInterval(() => {
            timeLeft--;
            btn.innerHTML = `Wait ${timeLeft}s...`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                btn.innerHTML = originalText;
                btn.disabled = false;
                window.open(url, '_blank');
            }
        }, 1000);
    }
</script>
