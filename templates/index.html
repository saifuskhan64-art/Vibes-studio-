<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibes Studio - All-in-One Video Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #050505; color: #f3f3f3; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .header { margin-top: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .brand-monogram {
            font-family: 'Cinzel', serif; font-size: 3.5rem; font-weight: 900;
            background: linear-gradient(135deg, #fff 10%, #fcf6ba 40%, #bf953f 70%, #aa771c 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px;
        }
        .header h1 { font-family: 'Cinzel', serif; font-size: 2.5rem; color: #fff; margin-bottom: 6px; }
        .header p { color: #bfa15f; font-size: 1rem; }
        .container {
            background: #111111; padding: 25px; border-radius: 18px;
            border: 1px solid rgba(191, 149, 63, 0.4); width: 100%; max-width: 620px; margin-top: 20px;
        }
        .section-title { font-family: 'Cinzel', serif; font-size: 1.4rem; color: #bf953f; margin-bottom: 15px; text-transform: uppercase; }
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        .input-group input {
            padding: 15px; border-radius: 10px; border: 1px solid rgba(191, 149, 63, 0.5);
            background: #1a1a1a; color: #fff; font-size: 1rem; outline: none; width: 100%;
        }
        .btn-row { display: flex; gap: 12px; }
        .btn {
            flex: 1; padding: 15px; border-radius: 10px; border: none; font-size: 1rem;
            font-weight: 600; cursor: pointer; text-align: center;
        }
        .btn-preview { background: #1a1a1a; color: #bf953f; border: 1px solid rgba(191, 149, 63, 0.5); }
        .btn-download { background: linear-gradient(135deg, #bf953f, #aa771c); color: #050505; font-weight: 700; }
        .loader { display: none; border: 4px solid #222; border-top: 4px solid #bf953f; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .preview-box { display: none; margin-top: 20px; background: #080808; padding: 18px; border-radius: 12px; border: 1px dashed rgba(191, 149, 63, 0.6); text-align: center; }
        .video-card-preview { margin-top: 12px; background: #151515; padding: 12px; border-radius: 8px; }
        .thumbnail-placeholder { width: 100%; height: 180px; background: #1f1f1f; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #bf953f; font-weight: 700; font-size: 1.1rem; }
        .video-info-desc { margin-top: 10px; text-align: left; }
        .video-info-desc h4 { color: #f3f3f3; font-size: 1rem; margin-bottom: 4px; }
        .download-options { display: block; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(191, 149, 63, 0.2); text-align: left; }
        .option-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .opt-btn { background: #bf953f; color: #000; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; text-align: center; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-monogram">VS</div>
        <h1>Vibes Studio</h1>
        <p>The Ultimate Luxury All-in-One Video & Reels Downloader</p>
    </div>

    <div class="container">
        <h2 class="section-title">Paste Link & Download</h2>
        <div class="input-group">
            <input type="text" id="videoLink" placeholder="Paste video link here (FB, TikTok, Insta, YT)...">
            <div class="btn-row">
                <button type="button" class="btn btn-preview" onclick="processVideoLink()">Preview / Details</button>
                <button type="button" class="btn btn-download" onclick="processVideoLink()">Load Links</button>
            </div>
        </div>

        <div id="loadingSpinner" class="loader"></div>

        <div id="previewContainer" class="preview-box">
            <div class="video-card-preview">
                <div class="thumbnail-placeholder" id="thumbContainer">
                    <span>🎬 Ready to Process</span>
                </div>
                <div class="video-info-desc">
                    <h4 id="videoTitleDisplay">Video Detected</h4>
                    <p id="videoMetaDisplay" style="color: #aaa; font-size: 0.85rem;">Platform ready</p>
                </div>

                <div class="download-options" id="downloadOptions">
                    <h5 style="color: #bf953f; font-size: 0.9rem; margin-bottom: 5px;">CHOOSE ACTION:</h5>
                    <div class="option-grid" id="linksGrid">
                        <!-- Direct buttons -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function processVideoLink() {
            var link = document.getElementById('videoLink').value.trim();
            if(!link) { alert('Please paste a video link first!'); return; }

            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('previewContainer').style.display = 'none';

            setTimeout(function() {
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('previewContainer').style.display = 'block';

                let platform = "Online Platform";
                let title = "Downloaded Media File";

                if (link.includes('facebook.com') || link.includes('fb.watch')) {
                    platform = "Facebook Video / Reel";
                    title = "Facebook Media Content";
                } else if (link.includes('tiktok.com')) {
                    platform = "TikTok Video (No Watermark)";
                    title = "TikTok Clip";
                } else if (link.includes('instagram.com')) {
                    platform = "Instagram Reel";
                    title = "Instagram Media";
                } else if (link.includes('youtube.com') || link.includes('youtu.be')) {
                    platform = "YouTube Video";
                    title = "YouTube Stream";
                }

                document.getElementById('videoTitleDisplay').innerText = title;
                document.getElementById('videoMetaDisplay').innerText = "Platform: " + platform + " • Status: Ready";
                document.getElementById('thumbContainer').innerHTML = `<span>✨ ${platform} Detected</span>`;

                var grid = document.getElementById('linksGrid');
                grid.innerHTML = `
                    <a class="opt-btn" href="${link}" target="_blank">Play / View Online</a>
                    <a class="opt-btn" href="${link}" download target="_blank">Download File</a>
                `;
            }, 600);
        }
    </script>
</body>
</html>
